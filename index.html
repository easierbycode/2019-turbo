<!DOCTYPE html>
<html lang="en">

<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# article: http://ogp.me/ns/article#">
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />

<meta name="keywords" content="CAPCOM,Street fighter,fight,SFV,STREETFIGHTER,FG,Fighting game,CFN,Shadaloo" />
<meta name="author" content="CAPCOM" />
<meta name="copyright" content="(C) CAPCOM U.S.A., INC. 2016 ALL RIGHTS RESERVED." />
<meta name="description" content="The World President Will Walk &amp; Shoot" />
<title>APRIL FOOL 2019 WORLD PRESIDENT CHALLENGES A STG | CAPCOM:Shadaloo C.R.I.</title>

	<style>
	* {
		padding: 0;
		margin: 0;
		box-sizing: border-box;
		border: none;
		line-height: 1;
	}
	html, body {
		padding: 0;
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		position: relative;
		background: #000 url(img/bg.jpg) no-repeat center/cover;
	}
	#canvas {
		width: 100%;
		height: 100%;
		min-height: 375px;
		position: relative;
		z-index: 1;
	}
	#frame {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: 0;
		-webkit-user-select: none;
		user-select: none;
		display: flex;
		justify-content: center;
	}
	#frame img {
		width: auto;
		height: 100%;
		padding: 0;
		margin: 0;
	}
	canvas {
		margin: auto;
		display: block;
		height: 100%;
		width: auto;
	}

	#howtoModal {
		position: fixed;
		top: 0;
		left: 0;
		z-index: 10001;
		width: 100%;
		height: 100%;
		display: none;
	}
	#howtoModal .howtoModalCover {
		position: absolute;
		width: 100%;
		height: 100%;
		top: 0;
		left: 0;
		background-color: rgba(0,0,0,0.9);
	}
	#howtoModal .howtoModalContent {
		position: relative;
		text-align: center;
		overflow: auto;
		height: 100%;
		width: 90%;
		max-width: 1500px;
		margin: auto;
		-webkit-overflow-scrolling: touch;
	}
	#howtoModal .howtoModalContent img {
		display: inline-block;
		width: 100%;
	}
	#howtoModal .howtoModalCloseBtn {
		width: 34px;
		height: 34px;
		background: #fff url("img/modalCloseBtn.gif") no-repeat;
		position: absolute;
		top: 1.5%;
		right: 5%;
		cursor: pointer;
	}
	#howtoModal .howtoModalCloseBtn:hover { opacity: 0.5; }

	@media screen and ( min-width:414px ) {
		canvas { max-height: 100% !important; min-height: 100%; }
	}
	</style>

	<script type="importmap">
	{
		"imports": {
			"phaser": "https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.esm.js"
		}
	}
	</script>
</head>

<body>
	<div id="canvas"></div>
	<div id="frame"><img src="img/frame.jpg" alt=""></div>

	<div id="howtoModal">
		<div class="howtoModalCover"></div>
		<div class="howtoModalContent">
			<img src="img/howto_en.jpg" alt="">
		</div>
		<div class="howtoModalCloseBtn"></div>
	</div>

	<script>
		window.howtoModalOpen = function () {
			document.getElementById('howtoModal').style.display = 'block';
		};
		window.howtoModalClose = function () {
			document.getElementById('howtoModal').style.display = 'none';
		};
		document.querySelector('#howtoModal .howtoModalCloseBtn').addEventListener('click', window.howtoModalClose);
		document.querySelector('#howtoModal .howtoModalCover').addEventListener('click', window.howtoModalClose);
	</script>

	<!-- Boot the Phaser port by default, or the original PixiJS build with ?pixi=1. -->
	<script>
		(function () {
			if (new URLSearchParams(location.search).get('pixi') === '1') {
				// Original build: load its globals (PIXI, pixi-sound, jQuery, GSAP) then
				// the bundle, which auto-boots on window load. Classic (blocking) scripts
				// keep load order and finish before the load event.
				[
					'js/pixi.min.js',
					'js/pixi-sound.min.js',
					'js/jquery.2.1.3.js',
					'js/TweenMax.min.js',
					'app_formatted.js'
				].forEach(function (src) {
					document.write('<script src="' + src + '"><\/script>');
				});
				// Asset base the original reads at load (empty = relative to this page).
				// Written after the bundle so it isn't in the DOM when the bundle evaluates
				// its own `'baseUrl' in window` check (an id makes it a named global).
				document.write('<div id="baseUrl"></div>');
			} else {
				// Phaser port: dynamic import() runs the ES module and honours the
				// import map above (document.write of a module script would not execute).
				import('./src/main.js');
			}
		})();
	</script>
</body>
</html>
